<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FBF3E8">
  <title>Invoice — Nexora</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://nexora-outbound.netlify.app/invoice">
  <link rel="preload" href="/assets/fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" type="image/svg+xml" href="/assets/brand/nexora-mark.svg">
  <link rel="stylesheet" href="/assets/css/fonts.css">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/ui.css">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body data-page="invoice">
  <header class="invoice-toolbar">
    <a class="btn btn-secondary btn-sm" href="/dashboard">← Back to dashboard</a>
    <div class="invoice-toolbar-right"><span class="status-pill" id="invoice-status" role="status" aria-live="polite">—</span><button type="button" class="btn btn-primary btn-sm" id="print-btn" disabled>Print / Save PDF</button></div>
  </header>
  <main class="invoice-page">
    <h1 class="visually-hidden">Invoice</h1>
    <div class="invoice-sheet" id="invoice-sheet" aria-busy="true">
      <div class="invoice-loading" role="status">Loading invoice…</div>
    </div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>
  <script src="/assets/js/app.js"></script>
  <script src="/assets/js/analytics.js"></script>
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TFWF9BMK" class="gtm-noscript" height="0" width="0"></iframe></noscript>
</body>
</html>
